<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tinycast Notes · 双栏手记（版本 B 原型）</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --page-bg: #111216;
      --page-card: #1a1c22;
      --page-border: rgba(255, 255, 255, 0.10);
      --page-ink: #f3f4f6;
      --page-muted: rgba(255, 255, 255, 0.62);
      --page-accent: #6cb4ff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", sans-serif;
      background: var(--page-bg);
      color: var(--page-ink);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .font-mono {
      font-family: "SF Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    /* ---------- Outer Showcase Chrome ---------- */
    .showcase-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 24px 36px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .showcase-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--page-border);
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-badge {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--page-accent);
      color: #0b111b;
      font-weight: 700;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .showcase-title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .size-chip {
      font-size: 11px;
      padding: 2px 9px;
      border-radius: 999px;
      border: 1px solid var(--page-border);
      color: var(--page-muted);
    }

    .showcase-sub {
      font-size: 12px;
      color: var(--page-muted);
      margin-top: 4px;
    }

    .toolbar-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .ui-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 10px;
      border: 1px solid var(--page-border);
      background: var(--page-card);
      color: var(--page-ink);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 120ms ease, background-color 120ms ease;
    }
    .ui-btn:hover { opacity: 0.9; background: rgba(255, 255, 255, 0.08); }
    .ui-btn.primary {
      background: var(--page-accent);
      color: #091321;
      border-color: transparent;
      font-weight: 600;
    }

    /* ---------- Desktop Stage & Wallpaper ---------- */
    .desktop-stage {
      border-radius: 20px;
      border: 1px solid var(--page-border);
      padding: 34px 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      position: relative;
      min-height: 730px;
    }

    body.is-capture {
      overflow: hidden;
      background: transparent;
    }
    body.is-capture .showcase-wrap {
      max-width: none;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
    }
    body.is-capture .showcase-header,
    body.is-capture .showcase-footer {
      display: none;
    }
    body.is-capture .desktop-stage {
      border-radius: 0;
      border: none;
      width: 100vw;
      height: 100vh;
      min-height: 100vh;
      padding: 0;
    }

    .tc-stage-dark {
      --tc-scrim: rgba(18, 19, 22, 0.56);
      --tc-rim: rgba(255, 255, 255, 0.14);
      --tc-glass: rgba(255, 255, 255, 0.08);
      --tc-glass-strong: rgba(34, 36, 42, 0.90);
      --tc-glass-border: rgba(255, 255, 255, 0.16);
      --tc-ink-primary: rgba(255, 255, 255, 1.0);
      --tc-ink-body: rgba(255, 255, 255, 0.90);
      --tc-ink-secondary: rgba(255, 255, 255, 0.60);
      --tc-ink-tertiary: rgba(255, 255, 255, 0.40);
      --tc-selection: rgba(255, 255, 255, 0.11);
      --tc-hover: rgba(255, 255, 255, 0.055);
      --tc-separator: rgba(255, 255, 255, 0.10);
      --tc-card-fill: rgba(255, 255, 255, 0.055);
      --tc-control-surface: rgba(255, 255, 255, 0.10);
      --tc-border: rgba(255, 255, 255, 0.20);
      --tc-shadow: 0 32px 72px rgba(0, 0, 0, 0.56), 0 4px 18px rgba(0, 0, 0, 0.36);
      --tc-popover-shadow: 0 18px 42px rgba(0, 0, 0, 0.52);
      --tc-link: #6cb4ff;
      --tc-success: #4ade80;
      --tc-warning: #fbbf24;
      --tc-danger: #f87171;
      --tc-accent-soft: rgba(108, 180, 255, 0.18);
      --tc-check-ink: #141519;
      background:
        radial-gradient(circle at 18% 22%, rgba(88, 101, 242, 0.44) 0%, transparent 48%),
        radial-gradient(circle at 82% 28%, rgba(236, 72, 153, 0.30) 0%, transparent 45%),
        radial-gradient(circle at 52% 85%, rgba(16, 185, 129, 0.28) 0%, transparent 52%),
        linear-gradient(135deg, #131624 0%, #1d1b2f 50%, #121c22 100%);
    }

    .tc-stage-light {
      --tc-scrim: rgba(250, 250, 252, 0.68);
      --tc-rim: rgba(0, 0, 0, 0.10);
      --tc-glass: rgba(255, 255, 255, 0.58);
      --tc-glass-strong: rgba(248, 248, 250, 0.88);
      --tc-glass-border: rgba(0, 0, 0, 0.10);
      --tc-ink-primary: rgba(0, 0, 0, 1.0);
      --tc-ink-body: rgba(0, 0, 0, 0.85);
      --tc-ink-secondary: rgba(0, 0, 0, 0.60);
      --tc-ink-tertiary: rgba(0, 0, 0, 0.42);
      --tc-selection: rgba(0, 0, 0, 0.09);
      --tc-hover: rgba(0, 0, 0, 0.045);
      --tc-separator: rgba(0, 0, 0, 0.12);
      --tc-card-fill: rgba(0, 0, 0, 0.045);
      --tc-control-surface: rgba(0, 0, 0, 0.08);
      --tc-border: rgba(0, 0, 0, 0.18);
      --tc-shadow: 0 26px 60px rgba(15, 23, 42, 0.22), 0 4px 16px rgba(15, 23, 42, 0.12);
      --tc-popover-shadow: 0 16px 36px rgba(15, 23, 42, 0.18);
      --tc-link: #0066cc;
      --tc-success: #16a34a;
      --tc-warning: #d97706;
      --tc-danger: #dc2626;
      --tc-accent-soft: rgba(0, 102, 204, 0.12);
      --tc-check-ink: #ffffff;
      background:
        radial-gradient(circle at 18% 22%, rgba(99, 179, 237, 0.50) 0%, transparent 48%),
        radial-gradient(circle at 82% 24%, rgba(244, 162, 184, 0.46) 0%, transparent 46%),
        radial-gradient(circle at 48% 85%, rgba(134, 239, 172, 0.38) 0%, transparent 50%),
        linear-gradient(135deg, #e2ebf8 0%, #ede7f6 52%, #e4f2ef 100%);
    }

    /* ---------- Tinycast Notes Panel (1:1 Version B) ---------- */
    .tc-panel {
      width: 960px;
      height: 660px;
      max-width: 100%;
      background: var(--tc-scrim);
      backdrop-filter: blur(32px) saturate(145%);
      -webkit-backdrop-filter: blur(32px) saturate(145%);
      border: 1px solid var(--tc-rim);
      border-radius: 26px;
      box-shadow: var(--tc-shadow);
      color: var(--tc-ink-body);
      display: flex;
      overflow: hidden;
      position: relative;
      transition: width 260ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .tc-panel.is-collapsed {
      width: 680px;
    }

    .tc-glass {
      background: var(--tc-glass);
      backdrop-filter: blur(22px) saturate(140%);
      -webkit-backdrop-filter: blur(22px) saturate(140%);
      border: 1px solid var(--tc-glass-border);
    }

    .tc-glass-popover {
      background: var(--tc-glass-strong);
      backdrop-filter: blur(28px) saturate(150%);
      -webkit-backdrop-filter: blur(28px) saturate(150%);
      border: 1px solid var(--tc-glass-border);
      box-shadow: var(--tc-popover-shadow);
      border-radius: 16px;
    }

    .tc-bar-btn {
      color: var(--tc-ink-secondary);
      border: none;
      background: transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 120ms ease, color 120ms ease, transform 100ms ease;
    }
    .tc-bar-btn:hover { background: var(--tc-hover); color: var(--tc-ink-primary); }
    .tc-bar-btn.is-selected { background: var(--tc-selection); color: var(--tc-ink-primary); }
    .tc-bar-btn:active { transform: scale(0.95); }

    /* ---------- Sidebar (260px) ---------- */
    .tc-sidebar {
      width: 260px;
      flex-shrink: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--tc-separator);
    }

    .tc-sidebar-head {
      padding: 16px 14px 10px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }

    .tc-sidebar-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 24px;
    }

    .tc-traffic-lights {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .tc-tl-close {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ff5f57;
      border: 1px solid rgba(0, 0, 0, 0.16);
      cursor: pointer;
    }
    .tc-tl-dim {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--tc-control-surface);
    }

    .tc-search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      height: 32px;
      border-radius: 10px;
      background: var(--tc-card-fill);
      border: 1px solid var(--tc-separator);
    }
    .tc-search-box input {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      color: var(--tc-ink-primary);
      font-size: 12.5px;
    }
    .tc-search-box input::placeholder { color: var(--tc-ink-tertiary); }

    .tc-filter-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
    }

    .tc-pill-filter {
      border: none;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      cursor: pointer;
      background: transparent;
      color: var(--tc-ink-secondary);
      transition: background-color 120ms ease, color 120ms ease;
    }
    .tc-pill-filter.active {
      background: var(--tc-selection);
      color: var(--tc-ink-primary);
      font-weight: 500;
    }

    .tc-tag-chip {
      border: none;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 11px;
      cursor: pointer;
      background: var(--tc-card-fill);
      color: var(--tc-ink-tertiary);
    }
    .tc-tag-chip.active {
      background: var(--tc-accent-soft);
      color: var(--tc-link);
      font-weight: 500;
    }

    .tc-note-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 10px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .tc-note-card {
      padding: 8px 10px;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 110ms ease;
    }
    .tc-note-card:hover { background: var(--tc-hover); }
    .tc-note-card.active { background: var(--tc-selection); }

    .tc-note-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .tc-note-card-title-wrap {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }

    .tc-note-card-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--tc-ink-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tc-note-card-pin {
      border: none;
      background: transparent;
      cursor: pointer;
      opacity: 0;
      padding: 2px;
      border-radius: 4px;
      display: inline-flex;
      transition: opacity 120ms ease;
    }
    .tc-note-card:hover .tc-note-card-pin { opacity: 0.9; }

    .tc-note-card-preview {
      font-size: 11.5px;
      color: var(--tc-ink-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .tc-note-card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
      font-size: 10.5px;
      color: var(--tc-ink-tertiary);
    }

    .tc-meta-badges {
      display: flex;
      align-items: center;
      gap: 6px;
      font-variant-numeric: tabular-nums;
    }

    .tc-sidebar-foot {
      height: 38px;
      padding: 0 16px;
      border-top: 1px solid var(--tc-separator);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--tc-ink-tertiary);
      flex-shrink: 0;
    }

    /* ---------- Right Editor Pane ---------- */
    .tc-editor-pane {
      flex: 1;
      min-width: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .tc-titlebar {
      height: 52px;
      padding: 0 14px 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
      position: relative;
    }

    .tc-titlebar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .tc-title-btn {
      border: none;
      background: transparent;
      font-size: 14px;
      font-weight: 600;
      color: var(--tc-ink-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 280px;
      cursor: text;
      text-align: left;
    }
    .tc-title-btn:hover { opacity: 0.82; }

    .tc-title-input {
      width: 220px;
      padding: 3px 8px;
      border-radius: 8px;
      background: var(--tc-selection);
      color: var(--tc-ink-primary);
      border: 1px solid var(--tc-border);
      font-size: 13.5px;
      font-weight: 600;
      outline: none;
    }

    .tc-save-pill {
      border: none;
      background: transparent;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      color: var(--tc-ink-secondary);
      cursor: pointer;
    }

    .tc-capsule-group {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      border-radius: 999px;
      flex-shrink: 0;
    }

    .tc-icon-btn {
      width: 28px;
      height: 28px;
      border-radius: 999px;
    }

    /* ---------- Editor Scroll & Markdown Typography ---------- */
    .tc-editor-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 6px 24px 16px;
    }

    .tc-md-h1 {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.3;
      color: var(--tc-ink-primary);
      margin: 2px 0 8px;
      letter-spacing: -0.015em;
    }
    .tc-md-h2 {
      font-size: 17px;
      font-weight: 700;
      line-height: 1.35;
      color: var(--tc-ink-primary);
      margin: 14px 0 6px;
    }
    .tc-md-h3 {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.4;
      color: var(--tc-ink-primary);
      margin: 12px 0 4px;
    }
    .tc-md-p {
      font-size: 14.5px;
      line-height: 1.62;
      color: var(--tc-ink-body);
      margin: 5px 0;
    }
    .tc-md-quote {
      margin: 8px 0;
      padding: 2px 0 2px 12px;
      border-left: 2px solid var(--tc-border);
      color: var(--tc-ink-secondary);
      font-size: 14px;
      line-height: 1.58;
    }

    .tc-md-task {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 6px 0;
    }
    .tc-checkbox {
      margin-top: 4px;
      width: 16px;
      height: 16px;
      border-radius: 5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
      transition: all 120ms ease;
    }

    .tc-md-codeblock {
      margin: 10px 0;
      border-radius: 10px;
      padding: 10px 12px;
      background: var(--tc-card-fill);
      border: 1px solid var(--tc-separator);
      font-size: 12.5px;
      line-height: 1.5;
    }
    .tc-codeblock-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .tc-codeblock-lang {
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--tc-ink-tertiary);
      font-weight: 600;
    }
    .tc-mini-copy {
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 11px;
      background: var(--tc-control-surface);
      color: var(--tc-ink-secondary);
      cursor: pointer;
    }
    .tc-mini-copy:hover { color: var(--tc-ink-primary); }

    /* ---------- Pasted Inline Image Card ---------- */
    .tc-image-card {
      margin: 12px 0;
      border-radius: 10px;
      border: 1px solid var(--tc-separator);
      background: var(--tc-card-fill);
      overflow: hidden;
      position: relative;
      max-width: 560px;
      transition: border-color 140ms ease;
    }
    .tc-image-card:hover {
      border-color: var(--tc-border);
    }
    .tc-image-stage {
      width: 100%;
      max-height: 196px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: zoom-in;
      background: rgba(0, 0, 0, 0.14);
    }
    .tc-image-stage img {
      width: 100%;
      max-height: 196px;
      object-fit: cover;
      display: block;
    }
    .tc-image-actions {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 3px;
      border-radius: 999px;
      opacity: 0;
      transition: opacity 140ms ease;
    }
    .tc-image-card:hover .tc-image-actions { opacity: 1; }
    .tc-image-action-btn {
      border: none;
      background: transparent;
      color: var(--tc-ink-primary);
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 11px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    .tc-image-action-btn:hover { background: var(--tc-selection); }
    .tc-image-caption {
      padding: 6px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--tc-ink-tertiary);
      border-top: 1px solid var(--tc-separator);
    }

    /* ---------- Bottom Formatting Band (52px) ---------- */
    .tc-bottom-band {
      height: 52px;
      padding: 0 14px 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }

    .tc-stats-btn {
      border: none;
      background: transparent;
      font-size: 11.5px;
      color: var(--tc-ink-tertiary);
      font-variant-numeric: tabular-nums;
      cursor: pointer;
    }
    .tc-stats-btn:hover { color: var(--tc-ink-secondary); }

    .tc-formatting-bar {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 4px;
      border-radius: 999px;
      flex-shrink: 0;
    }

    .tc-fmt-sep {
      width: 1px;
      height: 14px;
      margin: 0 2px;
      background: var(--tc-separator);
    }

    /* ---------- Popovers & Lightbox ---------- */
    .tc-popover-outline {
      position: absolute;
      right: 52px;
      top: 52px;
      width: 240px;
      padding: 6px;
      z-index: 30;
    }
    .tc-popover-more {
      position: absolute;
      right: 14px;
      top: 52px;
      width: 215px;
      padding: 6px;
      z-index: 30;
    }
    .tc-pop-row {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--tc-ink-body);
      padding: 7px 10px;
      border-radius: 10px;
      font-size: 12.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      text-align: left;
    }
    .tc-pop-row:hover { background: var(--tc-hover); }

    .tc-lightbox {
      position: fixed;
      inset: 0;
      background: rgba(8, 9, 12, 0.78);
      backdrop-filter: blur(18px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 90;
      padding: 28px;
    }
    .tc-lightbox-card {
      max-width: 820px;
      width: 100%;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(24, 25, 30, 0.92);
      box-shadow: 0 32px 80px rgba(0, 0, 0, 0.65);
    }

    .tc-hud {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      opacity: 0;
      pointer-events: none;
      transition: all 180ms ease;
      z-index: 100;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(24, 26, 32, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #fff;
      font-size: 12px;

    function showHUD(msg) {
      const hud = document.getElementById('hud');
      hud.innerHTML = `<span style="width:7px;height:7px;border-radius:50%;background:#4ade80;"></span><span>${escapeHtml(msg)}</span>`;
      hud.classList.add('show');
      clearTimeout(hudTimer);
      hudTimer = setTimeout(() => hud.classList.remove('show'), 2000);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function getActiveNote() {
      return state.notes.find(n => n.id === state.activeNoteId) || state.notes[0];
    }

    function getNoteMetrics(note) {
      const lines = note.content.split('\n');
      let tasksTotal = 0, tasksDone = 0, images = 0;
      for (const l of lines) {
        if (/^\s*-\s+\[(x|X| )\]\s+/.test(l)) {
          tasksTotal++;
          if (/^\s*-\s+\[(x|X)\]\s+/.test(l)) tasksDone++;
        }
        if (/^\s*!\[[^\]]*\]\([^)]+\)\s*$/.test(l)) images++;
      }
      const chars = note.content.length;
      const words = note.content.replace(/[#`>*\-\[\]!()]/g, ' ').trim().split(/\s+/).filter(Boolean).length;
      const mins = Math.max(1, Math.round(chars / 260));
      return { chars, words, mins, tasksTotal, tasksDone, images };
    }

    function getPlainPreview(note, query = '') {
      const lines = note.content.split('\n')
        .filter(l => !/^\s*!\[/.test(l) && !l.trim().startsWith('```'))
        .map(l => l.replace(/^#{1,6}\s+/, '').replace(/^>\s?/, '').replace(/^-\s+\[[ xX]\]\s+/, '').replace(/[`*_~]/g, '').trim())
        .filter(Boolean);
      if (query) {
        const hit = lines.find(l => l.toLowerCase().includes(query.toLowerCase()));
        if (hit) return hit;
      }
      return lines[1] || lines[0] || '空白笔记';
    }

    function getHeadings(note) {
      const lines = note.content.split('\n');
      const result = [];
      let inFence = false;
      lines.forEach((line, idx) => {
        if (line.trim().startsWith('```')) { inFence = !inFence; return; }
        if (inFence) return;
        const m = line.match(/^(#{1,3})\s+(.+)$/);
        if (m) result.push({ level: m[1].length, text: m[2].trim(), lineIdx: idx });
      });
      return result;
    }

    function getFilteredNotes() {
      const q = state.query.trim().toLowerCase();
      return state.notes.filter(n => {
        if (state.activeTag) {
          const t = '#' + state.activeTag.toLowerCase();
          if (!n.tags.includes(state.activeTag) && !n.content.toLowerCase().includes(t)) return false;
        } else if (state.filter === 'pinned' && !n.pinned) {
          return false;
        } else if (state.filter === 'tasks' && getNoteMetrics(n).tasksTotal === 0) {
          return false;
        }
        if (!q) return true;
        return n.title.toLowerCase().includes(q) || n.content.toLowerCase().includes(q);
      });
    }

    function triggerSavePulse() {
      if (state.saveStatus === 'conflict') return;
      state.saveStatus = 'saving';
      renderPanel();
      setTimeout(() => {
        if (state.saveStatus === 'saving') {
          state.saveStatus = 'saved';
          renderPanel();
        }
      }, 420);
    }

    function renderInlineMarkdown(text) {
      let html = escapeHtml(text);
      html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
        `<a href="javascript:void(0)" onclick="showHUD('打开链接：$2')" style="color: var(--tc-link); text-decoration: underline;">$1</a>`);
      html = html.replace(/`([^`]+)`/g,
        `<code class="font-mono" style="padding: 1px 6px; border-radius: 5px; font-size: 13px; background: var(--tc-control-surface); color: var(--tc-ink-primary);">$1</code>`);
      html = html.replace(/\*\*([^*]+)\*\*/g, `<strong style="font-weight: 600; color: var(--tc-ink-primary);">$1</strong>`);
      html = html.replace(/(^|\s)#([a-zA-Z0-9_-]+)/g,
        `$1<button onclick="filterByTag('$2')" style="border:none; padding: 1px 7px; border-radius: 999px; font-size: 12px; font-weight: 500; cursor: pointer; background: var(--tc-accent-soft); color: var(--tc-link);">#$2</button>`);
      return html;
    }

    function renderMarkdownBody(note) {
      if (state.rawMode) {
        return `<pre class="font-mono" style="font-size: 13px; line-height: 1.65; white-space: pre-wrap; color: var(--tc-ink-body);">${escapeHtml(note.content)}</pre>`;
      }

      const lines = note.content.split('\n');
      let html = '';
      let i = 0;
      let orderedNum = 0;

      while (i < lines.length) {
        const line = lines[i];

        if (line.trim().startsWith('```')) {
          const lang = line.trim().slice(3).trim() || 'code';
          const codeLines = [];
          i++;
          while (i < lines.length && !lines[i].trim().startsWith('```')) {
            codeLines.push(lines[i]);
            i++;
          }
          const codeText = codeLines.join('\n');
          html += `
            <div class="tc-md-codeblock font-mono">
              <div class="tc-codeblock-head">
                <span class="tc-codeblock-lang">${escapeHtml(lang)}</span>
                <button onclick="copyText(${JSON.stringify(codeText).replace(/"/g, '&quot;')}, '已复制代码块内容')" class="tc-mini-copy">
                  ${ICONS.copy}<span>复制</span>
                </button>
              </div>
              <pre style="overflow-x: auto; white-space: pre-wrap; color: var(--tc-ink-primary);">${escapeHtml(codeText)}</pre>
            </div>
          `;
          i++;
          continue;
        }

        // Standalone Markdown Image ![alt](path)
        const imgMatch = line.trim().match(/^!\[([^\]]*)\]\(([^)]+)\)$/);
        if (imgMatch) {
          const alt = imgMatch[1] || 'Pasted Image';
          const path = imgMatch[2];
          const asset = ASSET_REGISTRY[path];
          if (asset) {
            html += `
              <div class="tc-image-card">
                <div class="tc-image-stage" onclick="openLightbox('${escapeHtml(path)}')">
                  <img src="${asset.src}" alt="${escapeHtml(alt)}" />
                </div>
                <div class="tc-image-actions tc-glass-popover">
                  <button class="tc-image-action-btn" onclick="openLightbox('${escapeHtml(path)}')">${ICONS.zoom}<span>原图</span></button>
                  <button class="tc-image-action-btn" onclick="showHUD('已复制图片到剪贴板')">${ICONS.copy}<span>复制</span></button>
                  <button class="tc-image-action-btn" style="color: var(--tc-danger);" onclick="removeImageLine('${note.id}', ${i})">${ICONS.trash}</button>
                </div>
                <div class="tc-image-caption">
                  <span class="font-mono">${escapeHtml(path)}</span>
                  <span>${escapeHtml(asset.dims)}</span>
                </div>
              </div>
            `;
          } else {
            html += `<div class="tc-md-p font-mono" style="font-size:12px; color:var(--tc-warning);">[缺失图片: ${escapeHtml(path)}]</div>`;
          }
          i++;
          continue;
        }

        if (!line.trim()) {
          orderedNum = 0;
          html += `<div style="height: 8px;"></div>`;
          i++;
          continue;
        }

        if (/^---+$/.test(line.trim())) {
          html += `<div style="height: 1px; background: var(--tc-separator); margin: 14px 0;"></div>`;
          i++;
          continue;
        }

        const hMatch = line.match(/^(#{1,3})\s+(.+)$/);
        if (hMatch) {
          const lvl = hMatch[1].length;
          const cls = lvl === 1 ? 'tc-md-h1' : lvl === 2 ? 'tc-md-h2' : 'tc-md-h3';
          const hl = state.highlightedHeadingIdx === i
            ? 'background: var(--tc-accent-soft); border-radius: 6px; padding: 2px 6px; margin-left: -6px;'
            : '';
          html += `<div id="heading-line-${i}" class="${cls}" style="${hl}">${renderInlineMarkdown(hMatch[2])}</div>`;
          i++;
          continue;
        }

        if (line.startsWith('>')) {
          html += `<div class="tc-md-quote">${renderInlineMarkdown(line.replace(/^>\s?/, ''))}</div>`;
          i++;
          continue;
        }

        const taskMatch = line.match(/^\s*-\s+\[( |x|X)\]\s+(.+)$/);
        if (taskMatch) {
          const checked = taskMatch[1].toLowerCase() === 'x';
          html += `
            <div class="tc-md-task">
              <button onclick="toggleTaskLine('${note.id}', ${i})" class="tc-checkbox"
                style="border: 1.5px solid ${checked ? 'var(--tc-ink-secondary)' : 'var(--tc-border)'}; background: ${checked ? 'var(--tc-ink-secondary)' : 'transparent'}; color: var(--tc-check-ink);">
                ${checked ? ICONS.check : ''}
              </button>
              <span style="font-size: 14.5px; line-height: 1.58; ${checked ? 'text-decoration: line-through; color: var(--tc-ink-secondary);' : 'color: var(--tc-ink-body);'}">${renderInlineMarkdown(taskMatch[2])}</span>
            </div>
          `;
          i++;
          continue;
        }

        const ordMatch = line.match(/^\s*\d+\.\s+(.+)$/);
        if (ordMatch) {
          orderedNum++;
          html += `
            <div style="display:flex; align-items:flex-start; gap:8px; margin:4px 0;">
              <span style="width:18px; text-align:right; font-size:13.5px; color:var(--tc-ink-secondary); font-variant-numeric:tabular-nums;">${orderedNum}.</span>
              <span style="font-size:14.5px; line-height:1.6; color:var(--tc-ink-body);">${renderInlineMarkdown(ordMatch[1])}</span>
            </div>
          `;
          i++;
          continue;
        }

        const bulMatch = line.match(/^\s*[-*]\s+(.+)$/);
        if (bulMatch) {
          html += `
            <div style="display:flex; align-items:flex-start; gap:10px; margin:4px 0;">
              <span style="width:6px; height:6px; border-radius:50%; margin-top:9px; margin-left:4px; background:var(--tc-ink-secondary); flex-shrink:0;"></span>
              <span style="font-size:14.5px; line-height:1.6; color:var(--tc-ink-body);">${renderInlineMarkdown(bulMatch[1])}</span>
            </div>
          `;
          i++;
          continue;
        }

        html += `<p class="tc-md-p">${renderInlineMarkdown(line)}</p>`;
        i++;
      }

      return html;
    }

    function toggleRawMode() {
      state.rawMode = !state.rawMode;
      showHUD(state.rawMode ? '切换至纯 Markdown 源码' : '切换至 TextKit 2 渲染视图');
      renderPanel();
    }

    function toggleFormattingBar() {
      state.formattingExpanded = !state.formattingExpanded;
      renderPanel();
    }

    function cycleStatsMode() {
      state.statsMode = (state.statsMode + 1) % 3;
      renderPanel();
    }

    function cycleSaveStatus() {
      const order = ['saved', 'saving', 'conflict'];
      state.saveStatus = order[(order.indexOf(state.saveStatus) + 1) % order.length];
      renderPanel();
    }

    function onSearchInput(val) {
      state.query = val;
      renderPanel();
      const input = document.getElementById('sidebar-search');
      if (input) { input.focus(); input.setSelectionRange(val.length, val.length); }
    }

    function setFilter(f) {
      state.activeTag = null;
      state.filter = f;
      renderPanel();
    }

    function filterByTag(tag) {
      state.activeTag = state.activeTag === tag ? null : tag;
      if (!state.sidebarOpen) state.sidebarOpen = true;
      showHUD(state.activeTag ? `侧边栏已按 #${tag} 过滤` : '已清除标签过滤');
      renderPanel();
    }

    function selectNote(id) {
      state.activeNoteId = id;
      state.outlineOpen = false;
      state.moreMenuOpen = false;
      state.highlightedHeadingIdx = null;
      state.renamingHeader = false;
      renderPanel();
    }

    function togglePin(id, e) {
      e.stopPropagation();
      const n = state.notes.find(x => x.id === id);
      if (!n) return;
      n.pinned = !n.pinned;
      showHUD(n.pinned ? `已置顶「${n.title}」` : `已取消置顶「${n.title}」`);
      renderPanel();
    }

    function createNewNote() {
      const idx = state.notes.length + 1;
      const n = {
        id: `untitled-${idx}.md`,
        title: `随手记 ${idx}`,
        pinned: false,
        updatedLabel: '刚刚',
        tags: ['daily'],
        content: `# 随手记 ${idx}\n\n- [ ] 记录第一条待办\n\n直接按 **⌘V** 可粘贴剪贴板截图，自动存为 \`assets/\` 相对路径。 #daily`
      };
      state.notes.unshift(n);
      state.activeNoteId = n.id;
      triggerSavePulse();
      showHUD(`已新建「${n.title}」`);
      renderPanel();
    }

    function deleteActiveNote() {
      state.moreMenuOpen = false;
      if (state.notes.length <= 1) { showHUD('保留最后 1 篇演示笔记'); return; }
      const target = getActiveNote();
      state.notes = state.notes.filter(n => n.id !== target.id);
      state.activeNoteId = state.notes[0].id;
      showHUD(`已移到废纸篓：${target.title}`);
      renderPanel();
    }

    function beginRename() {
      state.renamingHeader = true;
      state.renameDraft = getActiveNote().title;
      renderPanel();
      setTimeout(() => {
        const el = document.getElementById('header-rename-input');
        if (el) { el.focus(); el.select(); }
      }, 20);
    }

    function commitRename() {
      if (!state.renamingHeader) return;
      const v = state.renameDraft.trim();
      const n = getActiveNote();
      if (v && v !== n.title) {
        n.title = v;
        triggerSavePulse();
        showHUD(`已重命名为「${v}」`);
      }
      state.renamingHeader = false;
      renderPanel();
    }

    function handleRenameKey(e) {
      state.renameDraft = e.target.value;
      if (e.key === 'Enter') commitRename();
      if (e.key === 'Escape') { state.renamingHeader = false; renderPanel(); }
    }

    function toggleTaskLine(noteId, lineIdx) {
      const n = state.notes.find(x => x.id === noteId);
      if (!n) return;
      const lines = n.content.split('\n');
      if (/^\s*-\s+\[ \]\s+/.test(lines[lineIdx])) {
        lines[lineIdx] = lines[lineIdx].replace('- [ ] ', '- [x] ');
      } else {
        lines[lineIdx] = lines[lineIdx].replace(/- \[[xX]\] /, '- [ ] ');
      }
      n.content = lines.join('\n');
      n.updatedLabel = '刚刚';
      triggerSavePulse();
      renderPanel();
    }

    function removeImageLine(noteId, lineIdx) {
      const n = state.notes.find(x => x.id === noteId);
      if (!n) return;
      const lines = n.content.split('\n');
      lines.splice(lineIdx, 1);
      n.content = lines.join('\n');
      triggerSavePulse();
      showHUD('已移除图片引用（本地 assets 原文件保留）');
      renderPanel();
    }

    function insertSnippet(snippet, label) {
      const n = getActiveNote();
      n.content = n.content.trimEnd() + '\n' + snippet;
      n.updatedLabel = '刚刚';
      triggerSavePulse();
      showHUD(`已插入「${label}」`);
      renderPanel();
    }

    function jumpToHeading(lineIdx) {
      state.outlineOpen = false;
      state.highlightedHeadingIdx = lineIdx;
      renderPanel();
      setTimeout(() => {
        const el = document.getElementById(`heading-line-${lineIdx}`);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 20);
    }

    function copyText(text, msg) {
      navigator.clipboard?.writeText(text).catch(() => {});
      showHUD(msg);
    }

    function openLightbox(path) {
      state.lightboxAsset = path;
      renderLightbox();
    }

    function closeLightbox() {
      state.lightboxAsset = null;
      renderLightbox();
    }

    function insertImageAsset(path, dataUrl, dims, altText) {
      ASSET_REGISTRY[path] = { src: dataUrl, dims, alt: altText };
      const n = getActiveNote();
      n.content = n.content.trimEnd() + `\n\n![${altText}](${path})`;
      n.updatedLabel = '刚刚';
      triggerSavePulse();
      renderPanel();
      setTimeout(() => {
        const scroller = document.getElementById('editor-scroll');
        if (scroller) scroller.scrollTop = scroller.scrollHeight;
      }, 30);
    }

    function simulatePasteImage() {
      const id = state.pasteCounter++;
      const path = `assets/20261123-15300${id}-f8a${id}.png`;
      insertImageAsset(path, SVG_TERMINAL_IMG, '1760×720 · PNG', `剪贴板粘贴截图 #${id}`);
      showHUD(`已保存并插入 ${path}`);
    }

    // Real clipboard paste listener (handles genuine Cmd+V screenshot paste in browser!)
    window.addEventListener('paste', (e) => {
      const items = e.clipboardData?.items;
      if (!items) return;
      for (const item of items) {
        if (item.type.startsWith('image/')) {
          e.preventDefault();
          const file = item.getAsFile();
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
            const url = ev.target.result;
            const img = new Image();
            img.onload = () => {
              const id = state.pasteCounter++;
              const ext = file.type === 'image/jpeg' ? 'jpg' : 'png';
              const path = `assets/20261123-clip-${id}.${ext}`;
              insertImageAsset(path, url, `${img.width}×${img.height} · ${ext.toUpperCase()}`, `剪贴板图片 #${id}`);
              showHUD(`真实 ⌘V 粘贴成功：${path}`);
            };
            img.src = url;
          };
          reader.readAsDataURL(file);
          return;
        }
      }
    });

    window.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === '\\') {
        e.preventDefault();
        toggleSidebar();
      }
      if (e.key === 'Escape' && state.lightboxAsset) {
        closeLightbox();
      }
    });

    // Apply initial theme from query params
    document.getElementById('desktop-stage').className =
      `desktop-stage ${state.appearance === 'dark' ? 'tc-stage-dark' : 'tc-stage-light'}`;
    renderPanel();
  </script>
</body>
</html>
